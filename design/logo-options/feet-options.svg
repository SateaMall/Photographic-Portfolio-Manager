<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2640 680" width="2640" height="680">
  <title>Feet Options</title>
  <defs>
    <path id="feather" d="M0 0 C -22 -26 -20 -64 0 -88 C 20 -64 22 -26 0 0 Z"/>
    <clipPath id="body-clip"><circle cx="256" cy="284" r="176"/></clipPath>

    <!-- logo B body, unchanged -->
    <g id="body">
      <use href="#feather" fill="#76ADEA" transform="translate(256 132) rotate(-36) scale(1.2)"/>
      <use href="#feather" fill="#76ADEA" transform="translate(256 132) rotate(36) scale(1.2)"/>
      <use href="#feather" fill="#8FC0F2" transform="translate(256 132) scale(1.2)"/>
      <circle cx="256" cy="284" r="176" fill="#76ADEA"/>
      <circle cx="236" cy="264" r="170" fill="#8FC0F2" clip-path="url(#body-clip)"/>
      <circle cx="256" cy="290" r="124" fill="#FFFFFF" stroke="#E1EDFB" stroke-width="7"/>
      <circle cx="256" cy="290" r="100" fill="#E4EEFA"/>
      <circle cx="256" cy="290" r="86" fill="#1F2C48"/>
      <circle cx="256" cy="290" r="70" fill="#2A4374"/>
      <g fill="none" stroke-width="9" stroke-linecap="round">
        <path d="M203.4 270.8 A56 56 0 0 1 246.3 234.9" stroke="#3CC4A6"/>
        <path d="M308.6 309.2 A56 56 0 0 1 265.7 345.1" stroke="#8F6FE3"/>
      </g>
      <circle cx="256" cy="290" r="40" fill="#0E1628"/>
      <circle cx="235" cy="269" r="14" fill="#FFFFFF"/>
      <circle cx="253" cy="284" r="6" fill="#FFFFFF"/>
    </g>

    <!-- stubby cat paws: one flat colour, two toe lines -->
    <g id="cat-paws">
      <g fill="#F1C08F">
        <path d="M164 420 L164 466 C164 480 174 487 196 487 C218 487 228 480 228 466 L228 420 Z"/>
        <path d="M284 420 L284 466 C284 480 294 487 316 487 C338 487 348 480 348 466 L348 420 Z"/>
      </g>
      <g stroke="#C98D5A" stroke-width="4" stroke-linecap="round">
        <line x1="185" y1="474" x2="185" y2="484"/>
        <line x1="207" y1="474" x2="207" y2="484"/>
        <line x1="305" y1="474" x2="305" y2="484"/>
        <line x1="327" y1="474" x2="327" y2="484"/>
      </g>
    </g>

    <!-- same paws with a thin hand-drawn outline -->
    <g id="outlined-paws" stroke="#C98D5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <g fill="#F1C08F">
        <path d="M164 420 L164 466 C164 480 174 487 196 487 C218 487 228 480 228 466 L228 420 Z"/>
        <path d="M284 420 L284 466 C284 480 294 487 316 487 C338 487 348 480 348 466 L348 420 Z"/>
      </g>
      <line x1="185" y1="474" x2="185" y2="486"/>
      <line x1="207" y1="474" x2="207" y2="486"/>
      <line x1="305" y1="474" x2="305" y2="486"/>
      <line x1="327" y1="474" x2="327" y2="486"/>
    </g>

    <!-- thin bird legs with three toes -->
    <g id="bird-feet" fill="none" stroke="#E8AE74" stroke-linecap="round" stroke-linejoin="round">
      <line x1="196" y1="440" x2="196" y2="472" stroke-width="10"/>
      <line x1="316" y1="440" x2="316" y2="472" stroke-width="10"/>
      <path d="M196 472 L172 488 M196 472 L196 493 M196 472 L220 488" stroke-width="9"/>
      <path d="M316 472 L292 488 M316 472 L316 493 M316 472 L340 488" stroke-width="9"/>
    </g>

    <!-- plain round feet, no toes -->
    <g id="round-feet" fill="#F1C08F">
      <ellipse cx="196" cy="462" rx="32" ry="20"/>
      <ellipse cx="316" cy="462" rx="32" ry="20"/>
    </g>

    <!-- paws tucked in front of the belly, like a sitting cat -->
    <g id="tucked-paws">
      <g fill="#F1C08F">
        <ellipse cx="204" cy="448" rx="30" ry="20"/>
        <ellipse cx="308" cy="448" rx="30" ry="20"/>
      </g>
      <g stroke="#C98D5A" stroke-width="4" stroke-linecap="round">
        <line x1="194" y1="456" x2="194" y2="465"/>
        <line x1="214" y1="456" x2="214" y2="465"/>
        <line x1="298" y1="456" x2="298" y2="465"/>
        <line x1="318" y1="456" x2="318" y2="465"/>
      </g>
    </g>

    <!-- small feather wings at the sides -->
    <g id="wings">
      <g transform="translate(100 300)">
        <use href="#feather" fill="#5F9BE3" transform="rotate(-172) scale(0.85)"/>
        <use href="#feather" fill="#6BA4E8" transform="rotate(-150) scale(0.85)"/>
      </g>
      <g transform="translate(412 300)">
        <use href="#feather" fill="#5F9BE3" transform="rotate(172) scale(0.85)"/>
        <use href="#feather" fill="#6BA4E8" transform="rotate(150) scale(0.85)"/>
      </g>
    </g>

    <g id="v1"><use href="#cat-paws"/><use href="#body"/></g>
    <g id="v2"><use href="#outlined-paws"/><use href="#body"/></g>
    <g id="v3"><use href="#bird-feet"/><use href="#body"/></g>
    <g id="v4"><use href="#round-feet"/><use href="#body"/></g>
    <g id="v5"><use href="#body"/><use href="#tucked-paws"/></g>
    <g id="v6"><use href="#cat-paws"/><use href="#body"/><use href="#wings"/></g>
  </defs>

  <rect width="2640" height="680" fill="#FFFFFF"/>

  <!-- full logos -->
  <svg x="20" y="20" width="400" height="400" viewBox="0 0 512 512"><use href="#v1"/></svg>
  <svg x="460" y="20" width="400" height="400" viewBox="0 0 512 512"><use href="#v2"/></svg>
  <svg x="900" y="20" width="400" height="400" viewBox="0 0 512 512"><use href="#v3"/></svg>
  <svg x="1340" y="20" width="400" height="400" viewBox="0 0 512 512"><use href="#v4"/></svg>
  <svg x="1780" y="20" width="400" height="400" viewBox="0 0 512 512"><use href="#v5"/></svg>
  <svg x="2220" y="20" width="400" height="400" viewBox="0 0 512 512"><use href="#v6"/></svg>

  <!-- labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#1B2A4A" text-anchor="middle">
    <text x="220" y="458">1 · Cat paws</text>
    <text x="660" y="458">2 · Outlined paws</text>
    <text x="1100" y="458">3 · Bird feet</text>
    <text x="1540" y="458">4 · Round feet</text>
    <text x="1980" y="458">5 · Tucked paws</text>
    <text x="2420" y="458">6 · Paws + wings</text>
  </g>

  <!-- close-ups of the feet -->
  <g fill="none" stroke="#E5ECF5" stroke-width="2">
    <rect x="20" y="484" width="400" height="172" rx="12"/>
    <rect x="460" y="484" width="400" height="172" rx="12"/>
    <rect x="900" y="484" width="400" height="172" rx="12"/>
    <rect x="1340" y="484" width="400" height="172" rx="12"/>
    <rect x="1780" y="484" width="400" height="172" rx="12"/>
    <rect x="2220" y="484" width="400" height="172" rx="12"/>
  </g>
  <svg x="20" y="484" width="400" height="172" viewBox="140 400 232 100"><use href="#v1"/></svg>
  <svg x="460" y="484" width="400" height="172" viewBox="140 400 232 100"><use href="#v2"/></svg>
  <svg x="900" y="484" width="400" height="172" viewBox="140 400 232 100"><use href="#v3"/></svg>
  <svg x="1340" y="484" width="400" height="172" viewBox="140 400 232 100"><use href="#v4"/></svg>
  <svg x="1780" y="484" width="400" height="172" viewBox="140 400 232 100"><use href="#v5"/></svg>
  <svg x="2220" y="484" width="400" height="172" viewBox="140 400 232 100"><use href="#v6"/></svg>
</svg>
