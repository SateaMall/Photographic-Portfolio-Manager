spring:
  datasource:
    url: jdbc:h2:mem:photo_gallery;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

# Spec at /v3/api-docs, interactive docs at /swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
