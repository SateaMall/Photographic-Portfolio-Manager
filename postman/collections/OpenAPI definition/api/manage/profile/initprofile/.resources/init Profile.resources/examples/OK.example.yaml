$kind: http-example
request:
  url: "{{baseUrl}}/api/manage/profile/initprofile"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "displayName": "string",
        "bio": "string",
        "primaryColor": "string",
        "secondaryColor": "string",
        "publicEmail": "string",
        "linkedIn": "string",
        "instagram": "string",
        "phoneNumber": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: "{}"
order: 1000
