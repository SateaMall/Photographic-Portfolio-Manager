$kind: http-example
request:
  url: "{{baseUrl}}/api/manage/profile/profile/:profileSlug/slug"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    profileSlug: string
  body:
    type: json
    content: |-
      {
        "slug": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: "{}"
order: 1000
