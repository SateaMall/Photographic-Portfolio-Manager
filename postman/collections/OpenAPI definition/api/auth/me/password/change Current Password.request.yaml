$kind: http-request
url: "{{baseUrl}}/api/auth/me/password"
method: PUT
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "currentPassword": "string",
      "newPassword": "string"
    }
examples: ./.resources/change Current Password.resources/examples
order: 1000
