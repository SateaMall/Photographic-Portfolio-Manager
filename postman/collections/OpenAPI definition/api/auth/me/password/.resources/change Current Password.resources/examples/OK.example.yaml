$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/me/password"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "currentPassword": "string",
        "newPassword": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: "{}"
order: 1000
