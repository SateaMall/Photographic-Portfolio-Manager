$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/reset-password"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "newPassword": "stringstring",
        "token": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: "{}"
order: 1000
